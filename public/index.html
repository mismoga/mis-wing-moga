<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIS WING MOGA</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}header{background:#102845;color:#fff;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand h1{margin:0}.brand p{margin:4px 0 0}nav button{background:none;border:0;color:#fff;padding:10px 14px;cursor:pointer;border-radius:7px}nav button.active,nav button:hover{background:#1769e0}main{max-width:1400px;margin:auto;padding:25px}.page{display:none}.page.active{display:block}.panel{background:#fff;border:1px solid #dce3ec;border-radius:12px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;box-sizing:border-box}input[readonly]{background:#f3f4f6}.btn{background:#1769e0;color:white;border:0;border-radius:7px;padding:10px 16px;font-weight:bold;cursor:pointer}.green{background:#138a43}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{max-width:520px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1350px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f7f9fc}.pending{color:#b45309;font-weight:bold}.updated{color:#15803d;font-weight:bold}.error{color:#dc2626}.notice{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:7px}.full{grid-column:1/-1}.filebox{border:1px dashed #9ca3af;padding:12px;border-radius:8px}@media(max-width:850px){.grid{grid-template-columns:1fr}.full{grid-column:auto}header{flex-direction:column;align-items:flex-start}}
</style></head><body>
<header><div class="brand"><h1>MIS WING MOGA</h1><p>Data Collection for Class Updation</p></div>
<nav><button class="active" onclick="showPage('home',this)">Home</button><button onclick="showPage('all',this)">All Records</button><button onclick="showPage('update',this)">🔒 Update Record</button></nav></header>
<main>
<section id="home" class="page active"><div class="panel"><h2>Student Data Entry</h2>
<form id="entry" class="grid">
<div><label>School UDISE Code Without Zero</label><input id="udise" name="udise_code" inputmode="numeric" required onblur="lookupSchool()"><small id="lookupMsg"></small></div>
<div><label>Block Name</label><input id="block" name="block_name" readonly required></div>
<div><label>School Name</label><input id="school" name="school_name" readonly required></div>
<div><label>PEN Number</label><input name="pen_number" required></div>
<div><label>Student Name</label><input name="student_name" required></div><div><label>Change Type</label><select id="change_type" name="change_type" onchange="applyHomeChangeType();"><option value="">Select Change Type</option><option value="Class Change">Class Change</option><option value="Gender Change">Gender Change</option><option value="Name change">Name change</option></select></div>
<div><label>New Gender</label><select name="new_gender" required class="genderopt"></select></div>
<div><label>New Class</label><select name="new_class" required class="classopt"></select></div>
<div><label>New Section</label><input name="new_section" required></div>
<div class="full filebox"><label>Upload Associated PDF (required)</label><input id="doc" type="file" accept="application/pdf" required>
<div class="upload-note">For Gender change, kindly attach a copy of Aadhaar Card in PDF.</div><small>PDF only, maximum 512 KB.</small></div>
<div><button type="submit" class="btn">Submit Student Record</button></div></form><p id="entryMsg"></p></div></section>

<section id="all" class="page"><div class="panel"><h2>All Records</h2><div class="toolbar"><input id="q" placeholder="Search Block, School, UDISE, PEN or Student" oninput="loadRecords()"><button class="btn" type="button" onclick="exportExcel()">⬇ Export Excel</button></div><div id="records" class="table"></div></div></section>

<section id="update" class="page"><div id="login" class="panel" style="max-width:500px"><h2>🔒 Update Record</h2><div class="notice">Authorized access only.</div><br><input id="pw" type="password" placeholder="Enter update password" autocomplete="off"><br><br><button class="btn" onclick="unlock()">Unlock</button><p id="loginMsg" class="error"></p></div>
<div id="admin" class="panel" style="display:none"><h2>Update Student Record</h2><div class="toolbar"><input id="uq" placeholder="Search PEN or student name" oninput="findRecords()"></div><div id="editList"></div></div></section>
</main>
<script>
let token="", schools=[];
const classes=["Nursery","LKG","UKG","1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th","11th","12th"];
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
async function init(){schools=await fetch("/school-master.json").then(r=>r.json());document.querySelectorAll(".classopt").forEach(s=>{s.innerHTML='<option value="">Select class</option>'+classes.map(c=>`<option>${c}</option>`).join("")});document.querySelectorAll(".genderopt").forEach(s=>{s.innerHTML='<option value="">Select gender</option>'+["Male","Female","Other"].map(c=>`<option>${c}</option>`).join("")});}
async function lookupSchool(){let code=udise.value.trim();if(/^0/.test(code)){block.value="";school.value="";lookupMsg.textContent="UDISE Code must be entered without a leading zero.";lookupMsg.className="error";return}let x=schools.find(s=>s.udise_code===code);if(x){block.value=x.block_name;school.value=x.school_name;lookupMsg.textContent=" ✓ School found";lookupMsg.className="updated"}else{block.value="";school.value="";lookupMsg.textContent=code?"UDISE Code not found. Check the code.":"";lookupMsg.className="error"}}
function showPage(id,b){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id==="all")loadRecords();}
async function loadRecords(){let r=await fetch("/api/records?q="+encodeURIComponent(q.value||""));let a=await r.json();records.innerHTML=a.length?`<table><tr><th>Block</th><th>School</th><th>UDISE</th><th>PEN</th><th>Student</th><th>New Gender</th><th>New Class</th><th>New Section</th><th>BMIS Remarks</th></tr>${a.map(x=>`<tr><td>${esc(x.block_name)}</td><td>${esc(x.school_name)}</td><td>${esc(x.udise_code)}</td><td>${esc(x.pen_number)}</td><td>${esc(x.student_name)}</td><td>${esc(x.new_gender)}</td><td>${esc(x.new_class)}</td><td>${esc(x.new_section)}</td><td class="${x.bmis_remarks}?'updated':'pending'}">${esc(x.bmis_remarks||"Pending to Update")}</td></tr>`).join("")}</table>`:"No records found."}
entry.onsubmit=async e=>{
  e.preventDefault();

  const form=document.getElementById("entry");
  const message=document.getElementById("entryMsg");
  const udiseEl=document.getElementById("udise");
  const blockEl=document.getElementById("block");
  const schoolEl=document.getElementById("school");
  const docEl=document.getElementById("doc");
  const changeTypeEl=document.getElementById("change_type");

  if(!form) return;

  const showError=(text)=>{
    if(message){ message.textContent=text; message.className="error"; }
  };
  const showSuccess=(text)=>{
    if(message){ message.textContent=text; message.className="updated"; }
  };

  const changeType=changeTypeEl?.value || "";
  if(!["Class Change","Gender Change","Name change"].includes(changeType)){
    showError("Please select a Change Type.");
    return;
  }

  const f=docEl?.files?.[0];
  if(!f){
    showError("PDF document is required.");
    return;
  }
  if(f.type!=="application/pdf"){
    showError("Only PDF files are allowed.");
    return;
  }
  if(f.size>512*1024){
    showError("PDF must be 512 KB or smaller.");
    return;
  }

  const submitButton=form.querySelector("button[type='submit'], button:not([type])");
  if(submitButton) submitButton.disabled=true;

  try{
    const b64=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(String(reader.result).split(",")[1] || "");
      reader.onerror=()=>reject(new Error("Could not read the PDF."));
      reader.readAsDataURL(f);
    });

    const fd=new FormData(form);
    const body=Object.fromEntries(fd.entries());

    body.udise_code=udiseEl?.value?.trim() || body.udise_code || "";
    body.block_name=blockEl?.value?.trim() || body.block_name || "";
    body.school_name=schoolEl?.value?.trim() || body.school_name || "";
    body.change_type=changeType;
    body.document_data=b64;
    body.document_name=f.name;
    body.document_type="application/pdf";

    if(changeType==="Class Change"){
      body.new_gender="N/A";
    }else if(changeType==="Gender Change"){
      body.new_class="N/A";
      body.new_section="N/A";
    }else if(changeType==="Name change"){
      body.new_gender="N/A";
      body.new_class="N/A";
      body.new_section="N/A";
    }

    const response=await fetch("/api/records",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });

    let result={};
    try{ result=await response.json(); }catch(_){}

    if(!response.ok){
      throw new Error(result.error || "Unable to save record.");
    }

    showSuccess("Student record submitted successfully.");
    form.reset();
    applyHomeChangeType();
  }catch(err){
    showError("Unable to save record: "+(err.message || "Unknown error"));
  }finally{
    if(submitButton) submitButton.disabled=false;
  }
}
async function findRecords(){
  if(!token)return;
  let r=await fetch("/api/records?q="+encodeURIComponent(uq.value||""),{
    headers:{"x-admin-token":token}
  });
  let a=await r.json();

  editList.innerHTML=a.length?a.map(x=>{
    const hasPdf=!!x.document_path;
    const hasRemarks=!!String(x.bmis_remarks||"").trim();
    const completed=x.bmis_status==="UPDATED_BY_BMIS" || (!hasPdf && hasRemarks);
    const canUpdate=hasPdf && hasRemarks && !completed;
    const status=completed
      ? "✓ Updated by BMIS"
      : (hasPdf
          ? (hasRemarks ? "✓ PDF checked — ready to Download & Update" : "Enter BMIS Remarks after checking PDF")
          : "No PDF attached");

    return `<div class="panel"><div class="grid">
<div><label>Change Type</label><select id="ct${x.id}">
<option value="">Select Change Type</option>
<option value="Class Change">Class Change</option>
<option value="Gender Change">Gender Change</option>
<option value="Name change">Name change</option>
</select></div>${field("Block Name","b",x)}${field("School Name","s",x)}${field("UDISE Code","u",x)}${field("PEN Number","p",x)}${field("Student Name","n",x)}${field("New Gender","ng",x)}${field("New Class","c",x)}${field("New Section","ns",x)}
<div class="full"><label>Remarks By BMIS</label><textarea id="r${x.id}" oninput="toggleUpdateButton(${x.id})" placeholder="Enter remarks only after checking the PDF">${esc(x.bmis_remarks)}</textarea></div>
<div class="full"><strong>Associated PDF:</strong> ${
  hasPdf
    ? `Available — <button type="button" class="btn" onclick="previewPdf(${x.id})">Preview PDF</button>`
    : (completed
        ? "<span class='updated'>PDF deleted after successful BMIS update</span>"
        : "<span class='error'>No document attached</span>")
}</div>
</div><br>
<div class="workflow-status" id="ur${x.id}">${status}</div>
<button id="ub${x.id}" class="btn green" data-has-pdf="${hasPdf?"1":"0"}" ${canUpdate?"":"disabled"} onclick="downloadThenUpdate(${x.id})">Download PDF &amp; Update Record</button>
<span id="m${x.id}"></span>
</div>`;
  }).join(""):"No matching record.";
}

function toggleUpdateButton(id){
  const button=document.getElementById("ub"+id);
  const status=document.getElementById("ur"+id);
  const remarks=document.getElementById("r"+id);
  if(!button || !remarks)return;

  const hasPdf=button.dataset.hasPdf==="1";
  const hasRemarks=!!remarks.value.trim();
  const changeType=!!document.getElementById("ct"+id)?.value;
  const enabled=hasPdf && hasRemarks && changeType;

  button.disabled=!enabled;
  if(status){
    status.textContent=enabled
      ? "✓ PDF checked — ready to Download & Update"
      : (hasPdf ? (!document.getElementById("ct"+id)?.value
          ? "Select Change Type"
          : "Enter BMIS Remarks after checking PDF") : "No PDF attached");
  }
}


function field(label,p,x){let map={b:"block_name",s:"school_name",u:"udise_code",p:"pen_number",n:"student_name",ng:"new_gender",c:"new_class",ns:"new_section"};return `<div><label>${label}</label><input id="${p}${x.id}" value="${esc(x[map[p]])}" ${p==="b"||p==="s"?"readonly":""}></div>`}
async function previewPdf(id){
  const r=await fetch("/api/records/"+id+"/document-preview",{headers:{"x-admin-token":token}});
  const j=await r.json();
  if(!r.ok){alert(j.error||"Could not open PDF");return}
  window.open(j.url,"_blank","noopener");
}

function applyHomeChangeType(){
  const type=document.getElementById("change_type")?.value || "";
  const form=document.getElementById("entry");
  if(!form)return;

  const gender=form.querySelector('[name="new_gender"]');
  const cls=form.querySelector('[name="new_class"]');
  const section=form.querySelector('[name="new_section"]');

  const wrap=el=>el ? el.parentElement : null;
  const gw=wrap(gender), cw=wrap(cls), sw=wrap(section);

  [gw,cw,sw].forEach(el=>{
    if(el){el.hidden=false;el.style.display="";}
  });

  if(type==="Class Change"){
    if(gw){gw.hidden=true;gw.style.display="none";}
  }else if(type==="Gender Change"){
    if(cw){cw.hidden=true;cw.style.display="none";}
    if(sw){sw.hidden=true;sw.style.display="none";}
  }else if(type==="Name change"){
    [gw,cw,sw].forEach(el=>{
      if(el){el.hidden=true;el.style.display="none";}
    });
  }
}
// Apply the initial state when the Home tab/form is loaded.
document.addEventListener("DOMContentLoaded", applyHomeChangeType);


async function downloadThenUpdate(id){
  const msg=document.getElementById("m"+id);
  const button=document.getElementById("ub"+id);
  const remarks=document.getElementById("r"+id)?.value.trim();

  if(!remarks){
    msg.textContent=" Enter BMIS Remarks after checking the PDF.";
    return;
  }

  const changeType=document.getElementById("ct"+id)?.value || "";
  if(!changeType){
    msg.textContent=" Select a Change Type before updating the record.";
    return;
  }

  if(!button || button.disabled)return;

  button.disabled=true;
  try{
    // STEP 1: Download the PDF through the MIS server.
    msg.textContent=" Downloading PDF...";
    const pdfResponse=await fetch("/api/records/"+id+"/document-data",{
      headers:{"x-admin-token":token}
    });
    if(!pdfResponse.ok){
      let e={}; try{e=await pdfResponse.json();}catch(_){}
      throw new Error(e.error||"PDF download failed");
    }

    const pdfBlob=await pdfResponse.blob();
    if(!pdfBlob.size) throw new Error("Downloaded PDF is empty");

    // STEP 2: Verify PDF was received, then trigger the browser download.
    const objectUrl=URL.createObjectURL(pdfBlob);
    const a=document.createElement("a");
    a.href=objectUrl;
    a.download=`${document.getElementById("u"+id).value}_${document.getElementById("p"+id).value}_${document.getElementById("n"+id).value.replace(/\s+/g,"_")}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);

    msg.textContent=" ✓ PDF downloaded. Saving BMIS update...";

    // STEP 3: Only after the PDF bytes have been downloaded, update the
    // student's BMIS remarks and other edited fields in the database.
    const v=p=>document.getElementById(p+id).value;
    const body={
      block_name:v("b"),
      school_name:v("s"),
      udise_code:v("u"),
      pen_number:v("p"),
      student_name:v("n"),
      change_type:document.getElementById("change_type")?.value || "",
      new_gender:v("ng"),
      new_class:v("c"),
      new_section:v("ns"),
      change_type:document.getElementById("ct"+id)?.value || "",
      bmis_remarks:remarks
    };

    const r=await fetch("/api/records/"+id,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "x-admin-token":token
      },
      body:JSON.stringify(body)
    });

    let j={};
    try{j=await r.json();}catch(_){}

    if(!r.ok) throw new Error(j.error||"Could not update BMIS remarks.");

    // The server deletes the PDF only after this database update succeeds.
    msg.textContent=j.documentDeleted
      ? " ✓ PDF downloaded, BMIS remarks updated, and PDF deleted."
      : " ✓ PDF downloaded and BMIS remarks updated. PDF deletion failed.";
    setTimeout(findRecords,700);
  }catch(e){
    msg.textContent=" ✕ "+(e.message||"PDF download/update failed. BMIS remarks were NOT updated.");
    button.disabled=false;
  }
}
init();
</script></body></html>
