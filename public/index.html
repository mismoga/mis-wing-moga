<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIS WING MOGA</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}header{background:#102845;color:#fff;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand h1{margin:0}.brand p{margin:4px 0 0}nav button{background:none;border:0;color:#fff;padding:10px 14px;cursor:pointer;border-radius:7px}nav button.active,nav button:hover{background:#1769e0}main{max-width:1400px;margin:auto;padding:25px}.page{display:none}.page.active{display:block}.panel{background:#fff;border:1px solid #dce3ec;border-radius:12px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;box-sizing:border-box}input[readonly]{background:#f3f4f6}.btn{background:#1769e0;color:white;border:0;border-radius:7px;padding:10px 16px;font-weight:bold;cursor:pointer}.green{background:#138a43}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{max-width:520px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1350px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f7f9fc}.pending{color:#b45309;font-weight:bold}.updated{color:#15803d;font-weight:bold}.error{color:#dc2626}.notice{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:7px}.full{grid-column:1/-1}.filebox{border:1px dashed #9ca3af;padding:12px;border-radius:8px}@media(max-width:850px){.grid{grid-template-columns:1fr}.full{grid-column:auto}header{flex-direction:column;align-items:flex-start}}
</style></head><body>
<header><div class="brand"><h1>MIS WING MOGA</h1><p>Data Collection for Class Updation</p></div>
<nav><button class="active" onclick="showPage('home',this)">Home</button><button onclick="showPage('all',this)">All Records</button><button onclick="showPage('update',this)">🔒 Update Record</button></nav></header>
<main>
<section id="home" class="page active"><div class="panel"><h2>Student Data Entry</h2>
<form id="entry" class="grid">
<div><label>School UDISE Code</label><input id="udise" name="udise_code" inputmode="numeric" required onblur="lookupSchool()"><small id="lookupMsg"></small></div>
<div><label>Block Name</label><input id="block" name="block_name" readonly required></div>
<div><label>School Name</label><input id="school" name="school_name" readonly required></div>
<div><label>PEN Number</label><input name="pen_number" required></div>
<div><label>Student Name</label><input name="student_name" required></div>
<div><label>Father Name</label><input name="father_name" required></div>
<div><label>Old Class</label><select name="old_class" required class="classopt"></select></div>
<div><label>New Class</label><select name="new_class" required class="classopt"></select></div>
<div><label>Email ID</label><input name="email_id" type="email" required></div>
<div class="full filebox"><label>Upload Associated PDF (required)</label><input id="doc" type="file" accept="application/pdf" required><small>PDF only, maximum 512 KB.</small></div>
<div><button class="btn">Submit Student Record</button></div></form><p id="entryMsg"></p></div></section>

<section id="all" class="page"><div class="panel"><h2>All Records</h2><div class="toolbar"><input id="q" placeholder="Search Block, School, UDISE, PEN, Student, Father or Email" oninput="loadRecords()"></div><div id="records" class="table"></div></div></section>

<section id="update" class="page"><div id="login" class="panel" style="max-width:500px"><h2>🔒 Update Record</h2><div class="notice">Authorized access only.</div><br><input id="pw" type="password" placeholder="Enter update password" autocomplete="off"><br><br><button class="btn" onclick="unlock()">Unlock</button><p id="loginMsg" class="error"></p></div>
<div id="admin" class="panel" style="display:none"><h2>Update Student Record</h2><div class="toolbar"><input id="uq" placeholder="Search PEN, student name or father name" oninput="findRecords()"></div><div id="editList"></div></div></section>
</main>
<script>
let token="", schools=[];
const classes=["Nursery","LKG","UKG","1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th","11th","12th"];
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
async function init(){schools=await fetch("/school-master.json").then(r=>r.json());document.querySelectorAll(".classopt").forEach(s=>{s.innerHTML='<option value="">Select class</option>'+classes.map(c=>`<option>${c}</option>`).join("")});}
async function lookupSchool(){let code=udise.value.trim();let x=schools.find(s=>s.udise_code===code);if(x){block.value=x.block_name;school.value=x.school_name;lookupMsg.textContent=" ✓ School found";lookupMsg.className="updated"}else{block.value="";school.value="";lookupMsg.textContent=code?"UDISE Code not found. Check the code.":"";lookupMsg.className="error"}}
function showPage(id,b){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id==="all")loadRecords();}
async function loadRecords(){let r=await fetch("/api/records?q="+encodeURIComponent(q.value||""));let a=await r.json();records.innerHTML=a.length?`<table><tr><th>Block</th><th>School</th><th>UDISE</th><th>PEN</th><th>Student</th><th>Father</th><th>Old</th><th>New</th><th>Email</th><th>BMIS Remarks</th><th>Document</th></tr>${a.map(x=>`<tr><td>${esc(x.block_name)}</td><td>${esc(x.school_name)}</td><td>${esc(x.udise_code)}</td><td>${esc(x.pen_number)}</td><td>${esc(x.student_name)}</td><td>${esc(x.father_name)}</td><td>${esc(x.old_class)}</td><td>${esc(x.new_class)}</td><td>${esc(x.email_id)}</td><td class="${x.bmis_remarks?'updated':'pending'}">${esc(x.bmis_remarks||"Pending to Update")}</td><td>${x.document_path?"Available":"Missing"}</td></tr>`).join("")}</table>`:"No records found."}
entry.onsubmit=async e=>{e.preventDefault();if(!block.value||!school.value){entryMsg.textContent="Please enter a valid UDISE Code.";entryMsg.className="error";return}let f=doc.files[0];if(!f){entryMsg.textContent="PDF document is required.";return}if(f.size>512*1024){entryMsg.textContent="PDF must be 10 MB or smaller.";return}let b64=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});let body=Object.fromEntries(new FormData(entry));body.document_data=b64;body.document_name=f.name;body.document_type=f.type;let r=await fetch("/api/records",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let j=await r.json();entryMsg.textContent=r.ok?"Record submitted successfully.":"Unable to save record: "+(j.error||"");entryMsg.className=r.ok?"updated":"error";if(r.ok)entry.reset();}
async function unlock(){let r=await fetch("/api/admin/unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw.value})});if(!r.ok){loginMsg.textContent="Incorrect password.";return}token=(await r.json()).token;login.style.display="none";admin.style.display="block";findRecords();}
async function findRecords(){if(!token)return;let r=await fetch("/api/records?q="+encodeURIComponent(uq.value||""),{headers:{"x-admin-token":token}});let a=await r.json();editList.innerHTML=a.length?a.map(x=>`<div class="panel"><div class="grid">
${field("Block Name","b",x)}${field("School Name","s",x)}${field("UDISE Code","u",x)}${field("PEN Number","p",x)}${field("Student Name","n",x)}${field("Father Name","f",x)}${field("Old Class","o",x)}${field("New Class","c",x)}${field("Email ID","e",x)}
<div class="full"><label>Remarks By BMIS</label><textarea id="r${x.id}">${esc(x.bmis_remarks)}</textarea></div>
<div class="full"><strong>Associated PDF:</strong> ${x.document_path?"Available — it will be downloaded before update.":"<span class='error'>No document attached</span>"}</div>
</div><br><button class="btn green" ${x.document_path?"":"disabled"} onclick="downloadThenUpdate(${x.id})">Download PDF &amp; Update Record</button><span id="m${x.id}"></span></div>`).join(""):"No matching record."}
function field(label,p,x){let map={b:"block_name",s:"school_name",u:"udise_code",p:"pen_number",n:"student_name",f:"father_name",o:"old_class",c:"new_class",e:"email_id"};return `<div><label>${label}</label><input id="${p}${x.id}" value="${esc(x[map[p]])}" ${p==="b"||p==="s"?"readonly":""}></div>`}
async function downloadThenUpdate(id){let msg=document.getElementById("m"+id);msg.textContent=" Preparing PDF...";let dr=await fetch("/api/records/"+id+"/document",{headers:{"x-admin-token":token}});if(!dr.ok){msg.textContent=" PDF download could not be prepared. Record was NOT updated.";return}let {url}=await dr.json();let a=document.createElement("a");a.href=url;a.download="student-document.pdf";a.target="_blank";document.body.appendChild(a);a.click();a.remove();msg.textContent=" PDF download started. Updating record...";let v=p=>document.getElementById(p+id).value;let body={block_name:v("b"),school_name:v("s"),udise_code:v("u"),pen_number:v("p"),student_name:v("n"),father_name:v("f"),old_class:v("o"),new_class:v("c"),email_id:v("e"),bmis_remarks:document.getElementById("r"+id).value};let r=await fetch("/api/records/"+id,{method:"PUT",headers:{"Content-Type":"application/json","x-admin-token":token},body:JSON.stringify(body)});let j=await r.json();msg.textContent=r.ok?" ✓ PDF download started and record updated.":" ✕ "+(j.error||"Update failed");}
init();
</script></body></html>
